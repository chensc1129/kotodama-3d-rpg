<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<title>言霊剣士・あの一撃 3D</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background-color: #090d16;
	overflow: hidden;
	touch-action: none;
	font-family: 'Noto Sans TC', 'Noto Sans JP', system-ui, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #090d16;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 55%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Mobile Portrait Rotate Guard */
#rotate-guard {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 9999;
	background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 78%);
	color: #f8fafc;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	text-align: center;
	padding: 28px;
	box-sizing: border-box;
}

#rotate-guard .card {
	max-width: 420px;
	width: 100%;
	background: rgba(15, 23, 42, 0.94);
	border: 2px solid #fbbf24;
	border-radius: 22px;
	padding: 28px 22px;
	box-shadow: 0 18px 48px rgba(0, 0, 0, 0.7);
}

#rotate-guard .icon {
	font-size: 54px;
	margin-bottom: 10px;
	display: inline-block;
	animation: tiltHint 1.6s ease-in-out infinite;
}

@keyframes tiltHint {
	0%, 100% { transform: rotate(0deg); }
	50% { transform: rotate(-90deg); }
}

#rotate-guard h2 {
	margin: 0 0 10px;
	color: #fcd34d;
	font-size: 22px;
}

#rotate-guard p {
	margin: 0 0 20px;
	color: #cbd5e1;
	font-size: 15px;
	line-height: 1.55;
}

#rotate-lock-btn {
	width: 100%;
	padding: 15px 18px;
	font-size: 17px;
	font-weight: 800;
	color: #0f172a;
	background: linear-gradient(135deg, #fbbf24, #f59e0b);
	border: 2px solid #fde68a;
	border-radius: 14px;
	cursor: pointer;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="rotate-guard" aria-live="polite">
			<div class="card">
				<div class="icon">📱</div>
				<h2>請將手機轉為橫向遊玩</h2>
				<p>《言霊剣士・あの一撃 3D》為橫向雙手動作 RPG。<br>請橫握手機，或點擊下方按鈕進入全螢幕並自動鎖定橫向！</p>
				<button id="rotate-lock-btn" type="button">⛶ 進入全螢幕並鎖定橫向</button>
			</div>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
window.kotodamaIsMobile = function () {
	try {
		return window.matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
	} catch (e) {
		return false;
	}
};

window.kotodamaLockLandscape = async function () {
	try {
		const el = document.documentElement;
		if (!document.fullscreenElement && el.requestFullscreen) {
			await el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
		} else if (!document.webkitFullscreenElement && el.webkitRequestFullscreen) {
			el.webkitRequestFullscreen();
		}
		if (screen.orientation && screen.orientation.lock) {
			await screen.orientation.lock('landscape').catch(() => {});
		}
	} catch (e) {}
	updateRotateGuard();
};

function updateRotateGuard() {
	const guard = document.getElementById('rotate-guard');
	if (!guard) return;
	const isMob = window.kotodamaIsMobile();
	const isPortrait = window.innerHeight > window.innerWidth;
	guard.style.display = (isMob && isPortrait) ? 'flex' : 'none';
}

window.addEventListener('resize', updateRotateGuard);
window.addEventListener('orientationchange', updateRotateGuard);
document.addEventListener('DOMContentLoaded', function () {
	updateRotateGuard();
	const btn = document.getElementById('rotate-lock-btn');
	if (btn) {
		btn.addEventListener('click', window.kotodamaLockLandscape);
	}
});
updateRotateGuard();

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":5392640,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
